# Start auf dem Server:  cp .env.example .env  (Werte anpassen)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raeume
      POSTGRES_USER: raeume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://raeume:${POSTGRES_PASSWORD}@db:5432/raeume
      TRUST_X_FORWARDED_FOR: "true"
    depends_on:
      - db

  # Löschfristen täglich um 3:30 Uhr umsetzen
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://raeume:${POSTGRES_PASSWORD}@db:5432/raeume
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); next=$$(date -d "tomorrow 03:30" +%s 2>/dev/null || echo $$((now+86400)))
          sleep $$((next-now))
          python manage.py datenschutz_bereinigen
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
